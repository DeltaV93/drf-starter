# Install once with:  pre-commit install
# Run against everything with:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^website/tsconfig.*\.json$   # these allow comments
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key

  # Secret scanning at commit time. This is GitGuardian's own hook, the same
  # engine as the GitGuardian check on pull requests -- catching a secret here
  # means it never reaches the remote at all.
  #
  # Needs a GITGUARDIAN_API_KEY in your environment (see CONTRIBUTING.md), and
  # like every pre-commit hook it can be skipped with `git commit --no-verify`.
  # It is a fast local net, not the gate; the gate is the required status check
  # on `main`.
  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.53.0
    hooks:
      - id: ggshield

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: missing-migrations
        name: check for missing migrations
        # Resolves the virtualenv explicitly: a bare `python` is whatever is on
        # PATH, so this hook failed for anyone who had not activated the venv
        # first -- which is most people running `pre-commit run --all-files`.
        entry: bash -c 'exec "${VIRTUAL_ENV:-.venv}/bin/python" manage.py makemigrations --check --dry-run'
        language: system
        pass_filenames: false
        files: models\.py$
        env:
          DJANGO_SETTINGS_MODULE: clearpath.settings.testing

      - id: frontend-lint
        name: eslint
        entry: bash -c 'cd website && npx eslint --max-warnings 0'
        language: system
        pass_filenames: false
        files: ^website/src/.*\.(ts|tsx)$
