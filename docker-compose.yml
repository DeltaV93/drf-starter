name: drf-starter

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        # Development image: brings in pytest, ruff and debugpy.
        REQUIREMENTS: requirements/dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env
        required: false
    volumes:
      # Source is mounted so the dev server reloads on edit. Remove this in
      # any deployed environment -- it shadows the image's own code.
      - .:/app
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy, active only when DEBUGPY=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    command: celery -A clearpath worker -l info
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      # The web service owns migrations; the worker just waits for the schema.
      RUN_MIGRATIONS: "0"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
