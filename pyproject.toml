[project]
name = "drf-starter"
version = "0.1.0"
description = "Django REST Framework + React starter template"
requires-python = ">=3.11"

# Dependencies are managed in requirements/ rather than here, so that Docker
# layer caching can install them without copying the whole project first.

[tool.ruff]
target-version = "py311"
line-length = 95
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "website",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument -- common and fine in DRF
    "RUF012",  # mutable class attrs need ClassVar -- noisy on Django classes
]

[tool.ruff.lint.per-file-ignores]
# Settings modules re-export via star imports on purpose.
"template/settings/*.py" = ["F403", "F405"]
"apps/*/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "clearpath", "utils"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clearpath.settings.testing"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "utils"]
addopts = [
    "--strict-markers",
    "--reuse-db",
    "-ra",
]
# The container serves ASGI, so some tests have to drive the async handler.
# Explicit rather than "auto": a plain `async def test_` with no marker should
# be a visible mistake, not silently skipped.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:apps.*",
    "error::DeprecationWarning:utils.*",
]

[tool.coverage.run]
source = ["apps", "utils", "clearpath"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/factories.py",
    "template/asgi.py",
    "template/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
