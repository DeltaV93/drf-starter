name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '26'

jobs:
  # A generated .gitignore contributes unanchored patterns (lib/, build/,
  # dist/, out/) that match at any depth, which silently excluded
  # website/src/lib/ from the repo -- everything passed locally and CI failed
  # on modules that were never pushed. This catches that in seconds.
  tracked:
    name: Source is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No source file is gitignored
        run: |
          untracked=$(git ls-files --others --ignored --exclude-standard \
            -- 'apps/**/*.py' 'utils/**/*.py' 'template/**/*.py' 'scripts/**/*.py' \
               'website/src/**/*.ts' 'website/src/**/*.tsx' \
               'packages/**/src/**/*.ts' 'mobile/src/**/*.ts' 'mobile/src/**/*.tsx')
          if [ -n "$untracked" ]; then
            echo "::error::These source files are ignored by .gitignore and are not in the repo:"
            echo "$untracked"
            exit 1
          fi
          echo "All source files are tracked."

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: template.settings.testing
      DB_ENGINE: postgres
      DB_NAME: test_app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test against Postgres
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Billing is optional. Prove the project still boots and passes with it
      # switched off, not just with the default-on test configuration.
      #
      # `--create-db` overrides the `--reuse-db` in pyproject: the database the
      # previous step left behind was built from a different INSTALLED_APPS.
      # Reusing it leaves `subscriptions_*` tables present but unmanaged, and a
      # `transaction=True` test then fails at teardown, because PostgreSQL
      # refuses to TRUNCATE a table that an untruncated one references.
      - name: Test with billing disabled
        env:
          STRIPE_ENABLED: 'false'
        run: pytest -q --create-db

      # Optional subsystems are independent by design -- no feature holds a
      # foreign key into another. This is what proves it: every flag off, then
      # every flag on, then each one off on its own against the rest.
      #
      # It does NOT cover the full combination space, and is not meant to.
      # With N flags that is 2^N; this catches the realistic failure, which is
      # one feature quietly depending on another.
      #
      # Each combination builds its own database -- see the step above for why
      # a reused one cannot be trusted once INSTALLED_APPS changes.
      - name: Flag combinations
        run: |
          set -uo pipefail
          FLAGS="STRIPE_ENABLED SOCIAL_AUTH_ENABLED EMAIL_ASYNC ORGANIZATIONS_ENABLED API_KEYS_ENABLED AUDIT_LOG_ENABLED TWO_FACTOR_ENABLED UPLOADS_ENABLED MCP_SERVER_ENABLED MCP_OAUTH_ENABLED MCP_CLIENT_ENABLED PUSH_ENABLED"

          run_with() {
            local label="$1"; shift
            echo "::group::$label"
            if ! env "$@" pytest -q --create-db; then
              echo "::endgroup::"
              echo "::error::suite failed with $label"
              return 1
            fi
            echo "::endgroup::"
          }

          failed=0

          off=(); for f in $FLAGS; do off+=("$f=false"); done
          run_with "all flags off" "${off[@]}" || failed=1

          on=();  for f in $FLAGS; do on+=("$f=true"); done
          run_with "all flags on" "${on[@]}" || failed=1

          for target in $FLAGS; do
            combo=()
            for f in $FLAGS; do
              if [ "$f" = "$target" ]; then combo+=("$f=false"); else combo+=("$f=true"); fi
            done
            run_with "only $target off" "${combo[@]}" || failed=1
          done

          echo "Covered: all-off, all-on, and each of $FLAGS off individually."
          echo "Not covered: the remaining combinations of $(echo $FLAGS | wc -w) flags."
          exit $failed

      - name: Production deployment checklist
        env:
          DJANGO_SETTINGS_MODULE: template.settings.production
          SECRET_KEY: ci-only-key-long-enough-to-satisfy-the-deploy-check-000000
          ALLOWED_HOSTS: example.com
          # Production refuses to fall back to a localhost database, so the
          # checklist needs one configured. Never connected to; only parsed.
          DATABASE_URL: postgres://checks:checks@db.example.com:5432/checks
          FRONTEND_URL: https://example.com
          STRIPE_ENABLED: 'true'
        run: python manage.py check --deploy --fail-level WARNING

      - name: OpenAPI schema generates without warnings
        run: python manage.py spectacular --fail-on-warn --file /dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # One lockfile at the root: website, mobile and packages/shared are
          # npm workspaces. Installing inside one of them would produce a
          # second lockfile and a second copy of React.
          cache-dependency-path: package-lock.json

      - run: npm ci

      # packages/shared has no lint of its own, so its typecheck runs here --
      # it is the website's dependency, and a break in it breaks this build.
      - name: Typecheck the shared package
        run: npm run typecheck --workspace @app/shared

      - name: Lint
        run: npm run lint --workspace website

      - name: Typecheck
        run: npm run typecheck --workspace website

      - name: Test
        run: npm run test --workspace website

      - name: Build
        run: npm run build --workspace website

  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace mobile

      - name: Typecheck
        run: npm run typecheck --workspace mobile

      - name: Test
        run: npm run test --workspace mobile

      # Not a build: an app binary needs EAS and signing material, which a
      # pull request has no business holding. This is the equivalent check --
      # it resolves every import and every asset through Metro, which is what
      # catches a module that only exists on someone's laptop.
      - name: Bundle with Metro
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-export

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the production image, which also runs collectstatic -- the step
      # that used to be in the wrong stage.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: drf-starter:ci
          build-args: REQUIREMENTS=requirements/prod.txt
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # Django imports, and the SPA build actually landed in the image --
          # a frontend stage that silently produced nothing would otherwise
          # ship an API with no UI.
          docker run --rm --entrypoint python drf-starter:ci \
            -c "import django; print('django', django.get_version())"
          docker run --rm --entrypoint sh drf-starter:ci \
            -c "test -s /app/website/dist/index.html && ls /app/website/dist/assets | head -5"
          # The catch-all must be registered when the build is present.
          docker run --rm --entrypoint python \
            -e DJANGO_ENVIRONMENT=production \
            -e SECRET_KEY=ci-only-key-long-enough-to-satisfy-the-deploy-check-000000 \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=postgres://checks:checks@db.example.com:5432/checks \
            -e FRONTEND_URL=https://example.com \
            drf-starter:ci -c "
          import django; django.setup()
          from django.conf import settings
          assert settings.SERVE_SPA, 'SERVE_SPA should be on when the build is present'
          print('SERVE_SPA on, WHITENOISE_ROOT =', settings.WHITENOISE_ROOT)
          "

      # The checks above only prove the files are in the image. They were all
      # green while the deployed app served index.html for every JavaScript
      # bundle -- the browser got HTML where it asked for a script and rendered
      # a blank page. Nothing is verified until something makes a request.
      #
      # This runs the ASGI command the Dockerfile's CMD uses, so it is also the
      # check that the transport switch did not change what a browser receives.
      # WhiteNoise has no async support, so its middleware is sync-adapted here
      # -- these asset assertions are what prove that still serves correctly.
      - name: Serve the image and check what a browser actually receives
        run: |
          set -euo pipefail

          # No database: this exercises static serving and URL resolution only,
          # so skip the entrypoint's wait and migrate.
          docker run -d --name spa-smoke -p 8000:8000 \
            -e DJANGO_ENVIRONMENT=production \
            -e SECRET_KEY=ci-only-key-long-enough-to-satisfy-the-deploy-check-000000 \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=postgres://checks:checks@db.example.com:5432/checks \
            -e FRONTEND_URL=https://example.com \
            -e SECURE_SSL_REDIRECT=false \
            --entrypoint sh drf-starter:ci \
            -c 'gunicorn template.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 1 --access-logfile -'

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/api/v1/health/ && break
            sleep 1
          done

          fail() { echo "::error::$1"; docker logs spa-smoke; docker rm -f spa-smoke; exit 1; }

          # The SPA itself.
          ctype=$(curl -sS -o /dev/null -w '%{content_type}' http://localhost:8000/)
          case "$ctype" in text/html*) ;; *) fail "/ returned $ctype, expected text/html" ;; esac

          # Every script the page pulls in. This is the assertion that matters:
          # the status was 200 the whole time it was broken -- it was the type
          # and the size that were wrong.
          html=$(curl -sS http://localhost:8000/)
          scripts=$(printf '%s' "$html" | grep -o '/assets/[A-Za-z0-9._-]*\.js' | sort -u)
          [ -n "$scripts" ] || fail "index.html referenced no /assets/*.js"

          # The failure being guarded against is an asset coming back as a byte
          # copy of index.html, so compare against index.html rather than some
          # arbitrary floor -- a small runtime chunk can legitimately be under
          # a kilobyte.
          index_size=$(curl -sS -o /dev/null -w '%{size_download}' http://localhost:8000/)

          for src in $scripts; do
            # Pipe-separated: content_type contains a space before its charset,
            # so splitting on whitespace would put the charset in $size.
            IFS='|' read -r code ctype size <<<"$(curl -sS -o /dev/null \
              -w '%{http_code}|%{content_type}|%{size_download}' "http://localhost:8000$src")"
            echo "$src -> $code $ctype $size"
            [ "$code" = 200 ] || fail "$src returned $code"
            case "$ctype" in *javascript*) ;; *) fail "$src served as $ctype, not JavaScript" ;; esac
            [ "$size" -ne "$index_size" ] || fail "$src is byte-identical to index.html ($size bytes)"
          done

          # A missing asset must 404 rather than quietly returning the SPA.
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/assets/not-real.js)
          [ "$code" = 404 ] || fail "a missing asset returned $code, expected 404"

          # The admin must not be swallowed, with or without the trailing slash.
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/admin)
          [ "$code" = 301 ] || fail "/admin returned $code, expected a 301 to /admin/"

          # A client-side route still gets the SPA.
          ctype=$(curl -sS -o /dev/null -w '%{content_type}' http://localhost:8000/login)
          case "$ctype" in text/html*) ;; *) fail "/login returned $ctype, expected the SPA" ;; esac

          # And the API still answers as JSON.
          ctype=$(curl -sS -o /dev/null -w '%{content_type}' http://localhost:8000/api/v1/health/)
          case "$ctype" in application/json*) ;; *) fail "health returned $ctype" ;; esac

          docker rm -f spa-smoke
